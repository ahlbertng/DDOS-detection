version: "3.9"

services:
  nextcloud:
    image: kefaslungu/hng-nextcloud
    container_name: hng-nextcloud
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - HNG-nginx-logs:/var/log/nginx:ro

  nginx:
    image: nginx:1.25-alpine
    container_name: hng-nginx
    restart: unless-stopped
    depends_on:
      - nextcloud
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - HNG-nginx-logs:/var/log/nginx

  detector:
    build:
      context: ./detector
    container_name: hng-detector
    restart: unless-stopped
    depends_on:
      - nginx
    network_mode: host
    privileged: true
    volumes:
      - HNG-nginx-logs:/var/log/nginx:ro
      - ./detector/config.yaml:/app/config.yaml:ro
      - ./detector/audit.log:/app/audit.log
    env_file:
      - .env
    environment:
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}

volumes:
  HNG-nginx-logs:
    name: HNG-nginx-logs