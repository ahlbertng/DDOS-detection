events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    log_format hng_json escape=json
    '{'
      '"source_ip":"$http_x_forwarded_for",'
      '"remote_addr":"$remote_addr",'
      '"timestamp":"$time_iso8601",'
      '"method":"$request_method",'
      '"path":"$uri",'
      '"status":$status,'
      '"response_size":$body_bytes_sent'
    '}';

    access_log /var/log/nginx/hng-access.log hng_json;

    upstream nextcloud_backend {
        server nextcloud:80;
    }

    # Dashboard — serves ahlbert.duckdns.org
    server {
        listen 80;
        server_name ahlbert.duckdns.org;

        location / {
            proxy_pass http://host.docker.internal:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # Nextcloud — serves raw IP access
    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://nextcloud_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            real_ip_header X-Forwarded-For;
            set_real_ip_from 0.0.0.0/0;
            real_ip_recursive on;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }
}